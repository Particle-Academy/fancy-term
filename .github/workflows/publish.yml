name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      # Trusted Publishing (OIDC) — no token. Configured on npmjs.com after the
      # 0.1.0 bootstrap. OIDC needs npm 11.5+; the runner ships npm 10, so we
      # fetch a fresh npm via npx just for the publish.
      - name: Publish
        run: npx -y npm@latest publish --provenance --access public
